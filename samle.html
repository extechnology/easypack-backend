<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Card</title>
</head>
<body style="margin: 0; padding: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;">
    
    <div style="background: white; border-radius: 16px; padding: 48px 40px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); max-width: 400px; text-align: center; transform: translateY(0); transition: transform 0.3s ease;">
        
        <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 50%; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center; font-size: 40px;">
            👋
        </div>
        
        <h1 style="margin: 0 0 12px 0; font-size: 32px; font-weight: 600; color: #1a202c;">
            Welcome!
        </h1>
        
        <p style="margin: 0; font-size: 16px; color: #718096; line-height: 1.6;">
            We're excited to have you here. Let's get started on something amazing together.
        </p>
        
        <button style="margin-top: 32px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 14px 32px; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);" 
                onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 20px rgba(102, 126, 234, 0.5)';"
                onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 12px rgba(102, 126, 234, 0.4)';"
                onclick="alert('Welcome aboard! 🎉')">
            Get Started
        </button>
        
    </div>

</body>
</html>
